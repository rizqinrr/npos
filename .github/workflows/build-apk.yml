name: Build nPOS Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 3. Install NPM Dependencies
        run: npm ci

      - name: 4. Build Vite Web Assets
        run: npm run build

      - name: 5. Sync Capacitor Android
        run: npx cap sync android

      - name: 6. Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: 7. Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: 8. Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: 9. Build Debug APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: 10. Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nPOS-app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
